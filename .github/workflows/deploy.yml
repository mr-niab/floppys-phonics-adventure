name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      # Pre-recorded ElevenLabs audio is cached between runs, so only new or
      # changed lines are sent to ElevenLabs. Skipped if no secret is set.
      - name: Restore voice clips
        uses: actions/cache@v4
        with:
          path: public/audio
          key: voice-${{ hashFiles('src/content/**', 'src/lib/elevenlabs.ts') }}
          restore-keys: voice-
      - name: Record Floppy's voice with ElevenLabs
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        if: env.ELEVENLABS_API_KEY != ''
        run: npm run voice:generate

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
